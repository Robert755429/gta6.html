<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>GTA 6 - COUNTDOWN</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding-top:40px}
h1{color:#ff2d95;font-size:32px}
#timer{font-size:60px;font-weight:bold;color:#00ff88}
p{color:#aaa}
</style>
</head>
<body>
<h1>🏎️ GTA 6 - LEONIDA TI ASPETTA</h1>
<div id="timer">CARICAMENTO...</div>
<p>Preload fatto ✅ - Mancano solo...</p>
<script>
function update(){
  let target = new Date("2026-11-19T00:00:00+01:00");
  let now = new Date();
  let diff = target - now;
  if(diff <= 0){ document.getElementById('timer').innerHTML = "È USCITO! 🔥 GIOCA!"; return; }
  let h = Math.floor(diff / 3600000);
  let m = Math.floor((diff % 3600000) / 60000);
  let s = Math.floor((diff % 60000) / 1000);
  document.getElementById('timer').innerHTML = h + "h : " + m + "m : " + s + "s";
}
setInterval(update, 1000); update();
</script>
</body>
</html>
